[project]
name = "trysac-c4-from-yaml"
dynamic = ["version"]
description = "Generate C4 context, container and component diagrams in Mermaid syntax from one validated YAML architecture model with safe loading"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Gomez" }]
keywords = ["c4-from-yaml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.scripts]
c4-from-yaml = "c4_from_yaml.__main__:main"

[project.urls]
Homepage = "https://github.com/Trysac/u080-c4-from-yaml"
Source = "https://github.com/Trysac/u080-c4-from-yaml"
Issues = "https://github.com/Trysac/u080-c4-from-yaml/issues"
Changelog = "https://github.com/Trysac/u080-c4-from-yaml/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/c4_from_yaml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/c4_from_yaml"]

[tool.hatch.build.targets.sdist]
# Ship the library, its tests and its docs; never the factory's internal files.
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["c4_from_yaml"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
